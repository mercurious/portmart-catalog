# Resolve releases and publish catalog.json + media/ on GitHub Pages (CONTRACT R8).
# Source of truth: mercurious/portmart tools/catalog_repo/publish.yml (copied by tools/publish_catalog.sh).
name: publish
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
# Upload and deploy run in separate jobs: deploy-pages lists the run's
# artifacts, and right after an upload in the same job that list comes back
# empty (actions/deploy-pages#451). A rerun can't recover it (two artifacts).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 resolve.py --catalog catalog.json --media media --out site --base-url "$SITE" --previous "${SITE}catalog.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
